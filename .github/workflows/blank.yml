name: Build Android APK

on:
  push:
    branches:
      - main # או master, לפי שם הענף הראשי שלך
  workflow_dispatch: # מאפשר לך להפעיל את הבנייה גם ידנית

jobs:
  build:
    runs-level: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradle Executable
      run: chmod +x gradlew

    - name: Build Build APK
      run: ./gradlew assembleDebug # בונה APK של גרסת בדיקה (Debug)

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
